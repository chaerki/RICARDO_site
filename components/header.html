<style>
/* ===== DROPDOWN SERVIÇOS ===== */
.nav-dropdown {
    position: relative;
}

.nav-dropdown-trigger {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
}

.nav-dropdown-seta {
    width: 14px !important;
    height: 14px !important;
    transition: transform 0.3s ease;
    flex-shrink: 0;
}

.nav-dropdown:hover .nav-dropdown-seta,
.nav-dropdown.aberto .nav-dropdown-seta {
    transform: rotate(180deg);
}

.nav-dropdown-menu {
    position: absolute;
    top: calc(100% + 14px);
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(63, 94, 119, 0.16), 0 2px 8px rgba(0,0,0,0.06);
    border: 1px solid rgba(63, 94, 119, 0.08);
    min-width: 220px;
    padding: 8px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    z-index: 2000;
}

/* Pequena seta decorativa acima do dropdown */
.nav-dropdown-menu::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 12px;
    background: #ffffff;
    border-left: 1px solid rgba(63, 94, 119, 0.08);
    border-top: 1px solid rgba(63, 94, 119, 0.08);
    transform: translateX(-50%) rotate(45deg);
}

/* Desktop: abre no hover */
@media (min-width: 769px) {
    .nav-dropdown:hover .nav-dropdown-menu {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
    }
}

/* Mobile: abre no clique */
.nav-dropdown.aberto .nav-dropdown-menu {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
}

.nav-dropdown-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    color: #3a3a3a;
    font-size: 0.9rem;
    font-weight: 500;
    transition: background 0.2s ease, color 0.2s ease;
    text-decoration: none;
    width: 100%;
}

.nav-dropdown-item:hover {
    background: #eef3f7;
    color: #3f5e77;
}

.nav-dropdown-item::after {
    display: none !important; /* remove a linha animada do nav padrão */
}

.nav-dropdown-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: #eef3f7;
    border-radius: 8px;
    flex-shrink: 0;
    transition: background 0.2s ease;
}

.nav-dropdown-item:hover .nav-dropdown-icon {
    background: #3f5e77;
}

.nav-dropdown-icon i {
    width: 16px !important;
    height: 16px !important;
    stroke: #3f5e77;
    transition: stroke 0.2s ease;
}

.nav-dropdown-item:hover .nav-dropdown-icon i {
    stroke: #ffffff;
}

/* Mobile: dropdown vira lista vertical interna */
@media (max-width: 768px) {
    .nav-dropdown-menu {
        position: static;
        transform: none !important;
        box-shadow: none;
        border: none;
        border-radius: 0;
        padding: 0 0 0 16px;
        background: transparent;
        min-width: unset;
        opacity: 0;
        visibility: hidden;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease, opacity 0.3s ease, visibility 0.3s ease;
    }

    .nav-dropdown-menu::before { display: none; }

    .nav-dropdown.aberto .nav-dropdown-menu {
        opacity: 1;
        visibility: visible;
        max-height: 200px;
        transform: none;
    }

    .nav-dropdown-item {
        padding: 8px 0;
        font-size: 0.9rem;
    }

    .nav-dropdown-icon {
        width: 28px;
        height: 28px;
    }
}
</style>

<script>
// Dropdown: mobile (toggle no clique), desktop (hover já tratado pelo CSS)
document.addEventListener('DOMContentLoaded', function () {
    var trigger = document.querySelector('.nav-dropdown-trigger');
    var dropdown = document.querySelector('.nav-dropdown');

    if (!trigger || !dropdown) return;

    // Fecha ao clicar em qualquer item do dropdown
    document.querySelectorAll('.nav-dropdown-item').forEach(function (item) {
        item.addEventListener('click', function () {
            dropdown.classList.remove('aberto');
        });
    });

    // Mobile: toggle ao clicar no trigger
    trigger.addEventListener('click', function (e) {
        if (window.innerWidth <= 768) {
            e.preventDefault();
            dropdown.classList.toggle('aberto');
        }
    });

    // Fecha ao clicar fora
    document.addEventListener('click', function (e) {
        if (!dropdown.contains(e.target)) {
            dropdown.classList.remove('aberto');
        }
    });
});
</script>
