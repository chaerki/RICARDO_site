<!-- Estilos do dropdown em /assets/css/estilo.css -->

<script>
// Dropdown: mobile (toggle no clique), desktop (hover já tratado pelo CSS)
document.addEventListener('DOMContentLoaded', function () {
    var trigger = document.querySelector('.nav-dropdown-trigger');
    var dropdown = document.querySelector('.nav-dropdown');

    if (!trigger || !dropdown) return;

    // Fecha ao clicar em qualquer item do dropdown
    document.querySelectorAll('.nav-dropdown-item').forEach(function (item) {
        item.addEventListener('click', function () {
            dropdown.classList.remove('aberto');
        });
    });

    // Mobile: toggle ao clicar no trigger
    trigger.addEventListener('click', function (e) {
        if (window.innerWidth <= 768) {
            e.preventDefault();
            dropdown.classList.toggle('aberto');
        }
    });

    // Fecha ao clicar fora
    document.addEventListener('click', function (e) {
        if (!dropdown.contains(e.target)) {
            dropdown.classList.remove('aberto');
        }
    });
});
</script>
